apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-db-init-sql
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        key_hash VARCHAR(64) NOT NULL UNIQUE, 
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    -- INSERE A CHAVE ADMIN-SECRETO-123 NA INICIALIZAÇÃO
    INSERT INTO api_keys (name, key_hash, is_active) 
    VALUES ('evaluation-service-internal', 'ee7281862cd2f7311ce63a920ec0cf1a774673620e791eeb0cc501708abce028', true)
    ON CONFLICT (key_hash) DO NOTHING;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-setup
  namespace: togglemaster
  annotations:
    # 🚀 O PULO DO GATO PARA O ARGOCD:
    # 1. Diz que o Job deve rodar ANTES de atualizar o app (PreSync)
    argocd.argoproj.io/hook: PreSync
    # 2. Deleta o job antigo automaticamente antes de criar o novo, evitando erros de imutabilidade
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: db-init
        image: postgres:15-alpine
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: DATABASE_URL
        command: ["/bin/sh", "-c", "psql $DATABASE_URL -f /scripts/init.sql"]
        volumeMounts:
        - name: sql-volume
          mountPath: /scripts
      volumes:
      - name: sql-volume
        configMap:
          name: auth-db-init-sql
      restartPolicy: OnFailure