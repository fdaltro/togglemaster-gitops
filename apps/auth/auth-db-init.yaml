apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-db-init-sql
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        key_hash VARCHAR(64) NOT NULL UNIQUE, 
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    
    -- 1. Chave do Evaluation Service
    INSERT INTO api_keys (name, key_hash, is_active) 
    VALUES ('evaluation-service-internal', 'ee72816b370e2f8ec1c5e37689aac124e34b34d48a895cb87a25e203ee42a3d7', true)
    ON CONFLICT (key_hash) DO NOTHING;

    -- 2. Chave Master (Para Handshake e Criação de Flags via curl)
    INSERT INTO api_keys (name, key_hash, is_active) 
    VALUES ('master-admin-key', '815c79fbfae5f815b8e66f610bb1899c9ad7124499f1cc5eca31050b3c62e9d9', true)
    ON CONFLICT (key_hash) DO NOTHING;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-setup
  namespace: togglemaster
  annotations:
    # 🚀 O PULO DO GATO PARA O ARGOCD:
    # 1. Diz que o Job deve rodar ANTES de atualizar o app (PreSync)
    argocd.argoproj.io/hook: PreSync
    # 2. Deleta o job antigo automaticamente antes de criar o novo, evitando erros de imutabilidade
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: db-init
        image: postgres:15-alpine
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: DATABASE_URL
        command: ["/bin/sh", "-c", "psql $DATABASE_URL -f /scripts/init.sql"]
        volumeMounts:
        - name: sql-volume
          mountPath: /scripts
      volumes:
      - name: sql-volume
        configMap:
          name: auth-db-init-sql
      restartPolicy: OnFailure