apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: togglemaster-auth
        ports:
        - containerPort: 8001

        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: DATABASE_URL

        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: MASTER_KEY

        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: PORT

        # ---> VARIÁVEIS DO OPENTELEMETRY <---
        - name: OTEL_SERVICE_NAME
          value: "auth-service"
          
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observabilidade.svc.cluster.local:4317"
          
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"

        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"

        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=prod,service.version=1.0.0"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 20